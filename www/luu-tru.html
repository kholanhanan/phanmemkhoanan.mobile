<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Lưu trữ cá nhân</title>
<script src="ui-scale.js?v=1.13-20261022"></script>
<link rel="stylesheet" href="fonts.css?v=1.16-20261028">
<link rel="stylesheet" href="luu-tru.css?v=1.16-20261028">
</head>
<body class="lt">
<!-- LƯU TRỮ CÁ NHÂN (ĐT 1.02) — chạy trong iframe của tab Công cụ (lt-phone.js). Giao diện lt-ui.js + luu-tru.css CHÉP Y NGUYÊN từ PC (app/html/);
     dữ liệu + đồng bộ: lt-backend.js (IndexedDB + LAN / Drive). Trang con lấy kết nối từ window.parent.LTHost (app.js). -->
<div id="app"></div>
<script>
/* Theo giao diện Sáng / Tối của app mẹ */
(function(){ try { var p = window.parent && window.parent.document.documentElement; var t = p && (p.getAttribute('data-theme') || (p.classList.contains('dark') ? 'dark' : '')); if (t) document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  if (p && window.MutationObserver) new MutationObserver(function(){ var v = p.getAttribute('data-theme'); document.documentElement.setAttribute('data-theme', v === 'dark' ? 'dark' : 'light'); }).observe(p, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {} })();
</script>
<script src="lan-guard.js?v=1.16-20261028"></script><!-- ĐT 1.16: chỉ cho kết nối LAN không mã hóa tới địa chỉ mạng nội bộ -->
<script src="lt-backend.js?v=1.16-20261028"></script>
<script src="lt-ui.js?v=1.16-20261028"></script>
</body>
</html>
